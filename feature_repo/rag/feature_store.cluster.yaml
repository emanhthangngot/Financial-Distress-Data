# GKE profile. RAG retrieval itself uses PGVector SQL, while this profile
# registers the same project and exposes its online-store contract in-cluster.
project: fd_rag
provider: local
registry: ${FEAST_REGISTRY_PATH}
online_store:
  type: postgres
  host: ${PHASE2_PG_HOST}
  port: 5432
  database: ${PHASE2_PG_DATABASE}
  db_schema: ml_metadata
  user: ${PHASE2_PG_USER}
  password: ${PHASE2_PG_PASSWORD}
offline_store:
  type: file
entity_key_serialization_version: 3
