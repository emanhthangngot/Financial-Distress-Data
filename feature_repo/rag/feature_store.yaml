# ${VAR} substitution works here (feast/repo_config.py:829,
# os.path.expandvars — POSIX-only, no ${VAR:-default}; PLATFORM_PG_USER/
# PLATFORM_PG_PASSWORD must be set in the environment `feast apply`/
# `materialize` runs in, e.g. from docker-compose.yml's platform-postgres
# service env). "platform-postgres:5432" is the docker-compose service DNS
# name (profile "platform").
project: fd_rag
provider: local
registry: s3://financial-distress-lake/platform/feast/rag/registry.db
online_store:
  type: postgres
  host: platform-postgres
  port: 5432
  database: ml_metadata
  db_schema: ml_metadata
  user: ${PLATFORM_PG_USER}
  password: ${PLATFORM_PG_PASSWORD}
offline_store:
  type: file
entity_key_serialization_version: 3
