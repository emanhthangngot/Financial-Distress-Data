services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financial_distress}
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - ./sql/init_project_metadata.sql:/docker-entrypoint-initdb.d/01_init_project_metadata.sql:ro

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do sleep 2; done;
      mc mb --ignore-existing local/${FINANCIAL_DISTRESS_BUCKET:-financial-distress-lake};
      "

  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    volumes:
      - ./infra/kafka:/opt/financial-distress-init:ro
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      - kafka
    volumes:
      - ./infra/kafka:/opt/financial-distress-init:ro
    command: bash /opt/financial-distress-init/kafka_init_topics.sh

  airflow-webserver:
    build:
      context: .
      dockerfile: infra/airflow/Dockerfile
    image: financial-distress-airflow:lakehouse
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-financial_distress}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow
      PROJECT_METADATA_DSN: postgresql://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-financial_distress}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FINANCIAL_DISTRESS_BUCKET: ${FINANCIAL_DISTRESS_BUCKET:-financial-distress-lake}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      SPARK_LOCAL_IP: 127.0.0.1
      LAKEHOUSE_EVIDENCE_DIR: /tmp/lakehouse-evidence
      ENABLE_FLINK: ${ENABLE_FLINK:-0}
      FLINK_JOBMANAGER_URL: ${FLINK_JOBMANAGER_URL:-http://flink-jobmanager:8081}
      FLINK_PARALLELISM: ${FLINK_PARALLELISM:-1}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./configs:/opt/airflow/configs
      - ./sql:/opt/airflow/sql
      - ./docs:/opt/airflow/docs
    ports:
      - "8080:8080"

  airflow-init:
    build:
      context: .
      dockerfile: infra/airflow/Dockerfile
    image: financial-distress-airflow:lakehouse
    depends_on:
      - postgres
    command: >
      bash -c "
      until airflow db migrate; do sleep 2; done;
      airflow users create --username airflow --password airflow --firstname Stage --lastname One --role Admin --email airflow@example.local || true
      "
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-financial_distress}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow
      PROJECT_METADATA_DSN: postgresql://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-financial_distress}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FINANCIAL_DISTRESS_BUCKET: ${FINANCIAL_DISTRESS_BUCKET:-financial-distress-lake}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      SPARK_LOCAL_IP: 127.0.0.1
      LAKEHOUSE_EVIDENCE_DIR: /tmp/lakehouse-evidence
      ENABLE_FLINK: ${ENABLE_FLINK:-0}
      FLINK_JOBMANAGER_URL: ${FLINK_JOBMANAGER_URL:-http://flink-jobmanager:8081}
      FLINK_PARALLELISM: ${FLINK_PARALLELISM:-1}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./configs:/opt/airflow/configs
      - ./sql:/opt/airflow/sql
      - ./docs:/opt/airflow/docs

  airflow-scheduler:
    build:
      context: .
      dockerfile: infra/airflow/Dockerfile
    image: financial-distress-airflow:lakehouse
    command: scheduler
    depends_on:
      - airflow-webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-financial_distress}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow
      PROJECT_METADATA_DSN: postgresql://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-financial_distress}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FINANCIAL_DISTRESS_BUCKET: ${FINANCIAL_DISTRESS_BUCKET:-financial-distress-lake}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      SPARK_LOCAL_IP: 127.0.0.1
      LAKEHOUSE_EVIDENCE_DIR: /tmp/lakehouse-evidence
      ENABLE_FLINK: ${ENABLE_FLINK:-0}
      FLINK_JOBMANAGER_URL: ${FLINK_JOBMANAGER_URL:-http://flink-jobmanager:8081}
      FLINK_PARALLELISM: ${FLINK_PARALLELISM:-1}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./configs:/opt/airflow/configs
      - ./sql:/opt/airflow/sql
      - ./docs:/opt/airflow/docs

  flink-jobmanager:
    build:
      context: .
      dockerfile: infra/flink/Dockerfile
    image: financial-distress-flink:lakehouse
    profiles: ["flink"]
    hostname: flink-jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 1
        parallelism.default: 1
        state.backend: filesystem
        state.checkpoints.dir: file:///tmp/flink-checkpoints
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/overview || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - ./src/streaming/flink/jobs:/opt/flink/jobs:ro
      - ./configs:/opt/flink/config:ro
      - flink-checkpoints:/tmp/flink-checkpoints

  flink-taskmanager:
    build:
      context: .
      dockerfile: infra/flink/Dockerfile
    image: financial-distress-flink:lakehouse
    profiles: ["flink"]
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    hostname: flink-taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 1
        taskmanager.registration.timeout: 120s
    volumes:
      - flink-checkpoints:/tmp/flink-checkpoints

  # --- Platform services (profile "platform") — never started by plain `docker compose up` ---

  platform-redis:                    # Feast online store, mirrors in-cluster Redis
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "${PLATFORM_REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    profiles: ["platform"]

  platform-postgres:                 # PGVector + ml datastore
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ml
      POSTGRES_USER: ${PLATFORM_PG_USER:-platform}
      POSTGRES_PASSWORD: ${PLATFORM_PG_PASSWORD:-platform}
    ports:
      - "${PLATFORM_PG_HOST_PORT:-5433}:5432"
    volumes:
      - ./sql/init_ml_metadata.sql:/docker-entrypoint-initdb.d/01_init_ml_metadata.sql:ro
      - platform-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PLATFORM_PG_USER:-platform} -d ml"]
      interval: 5s
      timeout: 10s
      retries: 10
    profiles: ["platform"]

volumes:
  flink-checkpoints:
  platform-pgdata:
