# Source-of-truth metadata for the platform .eployables.
# The caller workflows remain compatible while they are migrated incrementally.
#
# ML-track entries (feature-api, drift-api) were removed 2026-08-14 — the LLM
# submission does not need them and their zero-digest charts fail the strict
# --require-real-digests gate with no GHCR write:packages token available.
# Their source (apps/feature-api/, apps/drift-api/) is archived, not deleted;
# see plans/260813-1846-production-hardening-overlay/plan.md Overview.
version: 1
deployables:
  - name: phase1-pipeline
    image_context: .
    dockerfile: infra/phase1-cluster/Dockerfile.pipeline
    test_selector: "tests -k 'cluster_pipeline or lakehouse_jobs or feast'"
    lint_paths:
      - src/jobs/lakehouse_evidence_job.py
      - src/collectors/fixture_config.py
      - src/collectors/source_adapters/vnstock_fixture_adapter.py
      - scripts/run_cluster_pipeline.py
      - tests/test_cluster_pipeline.py
    gitops_chart: charts/fastapi-service/Chart.yaml
    gitops_values_path: platform/data/pipeline-deployments.yaml
    gitops_target_type: manifest
    gitops_target_kind: CronJob
    gitops_target_selector: phase1-gold-producer
  - name: stream-feature-offline
    image_context: .
    dockerfile: infra/stream-feature-offline/Dockerfile
    test_selector: "tests/platform/pipelines -k 'feast or ttl or stream'"
    lint_paths:
      - src/ml/feast/offline_job.py
      - src/ml/feast/feature_definitions.py
      - tests/platform/pipelines/test_stream_feature_jobs.py
    gitops_chart: charts/fastapi-service/Chart.yaml
    gitops_values_path: platform/data/pipeline-deployments.yaml
    gitops_target_type: manifest
    gitops_target_kind: CronJob
    gitops_target_selector: stream-feature-offline
  - name: stream-feature-online
    image_context: .
    dockerfile: infra/stream-feature-online/Dockerfile
    test_selector: "tests/platform/pipelines -k 'feast or ttl or stream'"
    lint_paths:
      - src/ml/feast/online_job.py
      - src/ml/feast/feature_definitions.py
      - tests/platform/pipelines/test_stream_feature_jobs.py
    gitops_chart: charts/fastapi-service/Chart.yaml
    gitops_values_path: platform/data/pipeline-deployments.yaml
    gitops_target_type: manifest
    gitops_target_kind: CronJob
    gitops_target_selector: stream-feature-online
  - name: rag-pipeline
    image_context: .
    dockerfile: infra/rag-pipeline/Dockerfile
    test_selector: "tests/platform/pipelines -k 'rag or governance'"
    lint_paths:
      - src/llm
      - tests/platform/pipelines/test_rag_chunking.py
      - tests/platform/pipelines/test_rag_dedup.py
      - tests/platform/pipelines/test_rag_metadata_contract.py
      - tests/platform/pipelines/test_data_governance.py
    gitops_chart: charts/fastapi-service/Chart.yaml
    gitops_values_path: platform/data/pipeline-deployments.yaml
    gitops_target_type: manifest
    gitops_target_kind: CronJob
    gitops_target_selector: rag-pipeline
  - name: feature-agent
    image_context: .
    dockerfile: apps/feature-mcp/Dockerfile
    test_selector: "tests/platform/agents tests/platform/apps -k 'feature or agent'"
    lint_paths:
      - src/agents
      - apps/feature-mcp/app
      - tests/platform/agents
    gitops_chart: charts/feature-mcp/Chart.yaml
    gitops_values_path: platform/agents/agent-deployments.yaml
    gitops_target_type: manifest
    gitops_target_kind: Deployment
    gitops_target_selector: feature-agent
  - name: drift-agent
    image_context: .
    dockerfile: apps/drift-mcp/Dockerfile
    test_selector: "tests/platform/agents tests/platform/apps -k 'drift or agent'"
    lint_paths:
      - src/agents
      - src/drift
      - apps/drift-mcp/app
      - tests/platform/agents
    gitops_chart: charts/drift-mcp/Chart.yaml
    gitops_values_path: platform/agents/agent-deployments.yaml
    gitops_target_type: manifest
    gitops_target_kind: Deployment
    gitops_target_selector: drift-agent
  - name: coordinator
    image_context: .
    dockerfile: apps/feature-mcp/Dockerfile
    test_selector: "tests/platform/agents -k 'coordinator'"
    lint_paths:
      - src/agents
      - tests/platform/agents
    gitops_chart: charts/feature-mcp/Chart.yaml
    gitops_values_path: platform/agents/agent-deployments.yaml
    gitops_target_type: manifest
    gitops_target_kind: Deployment
    gitops_target_selector: coordinator
  - name: drift-mcp
    image_context: .
    dockerfile: apps/drift-mcp/Dockerfile
    test_selector: "tests/platform/apps -k 'drift_mcp'"
    lint_paths:
      - src/drift
      - apps/drift-mcp/app
      - tests/platform/apps
    gitops_chart: charts/drift-mcp/Chart.yaml
    gitops_values_path: apps/dev/drift-mcp/values.yaml
    gitops_target_type: values
    gitops_target_kind: ""
    gitops_target_selector: ""
  - name: web
    image_context: .
    dockerfile: apps/web/Dockerfile
    test_selector: "tests/platform/verification -k 'web_api_adapters'"
    lint_paths:
      - tests/platform/verification/test_web_api_adapters.py
    gitops_chart: charts/web/Chart.yaml
    gitops_values_path: apps/dev/web/values.yaml
    gitops_target_type: values
    gitops_target_kind: ""
    gitops_target_selector: ""
