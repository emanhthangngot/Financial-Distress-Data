source_mode: online
primary_library: vnstock
fallback_sources:
  - cafe_f
  - vietstock
  - tcbs
  - ssi

markets:
  - HOSE
  - HNX
  - UPCOM
exclude_financial_sector: true

max_companies: 300
start_year: 2018
end_year: 2025
report_frequency: quarterly
trading_days_per_year: 250

request_timeout_seconds: 30
max_retries: 3
retry_backoff_seconds: 5
min_request_delay_seconds: 1
random_delay_jitter_seconds: 2
checkpoint_every_tickers: 25

persist_raw_payload: true
raw_payload_format: json
failed_ticker_policy: write_to_project_metadata_failed_records

stream_source_mode: websocket_or_polling
websocket_reconnect_seconds: 10
poll_interval_seconds: 60
stream_topics:
  price: financial.price_events
  news: financial.news_events
  alert: financial.alert_events
stream_topic_partitions: 3
stream_flush_interval_seconds: 60
stream_flush_record_count: 1000
stream_target_batch_file_mb_min: 5
stream_target_batch_file_mb_max: 50

fixture_mode_enabled: true
fixture_seed: 42

generator:
  enabled: true
  fixture_seed: 42
  skew:
    top_company_ticker: AAA
    top_company_share: 0.60
    tail_tickers:
      - BBB
      - CCC
      - DDD
      - EEE
  cardinality:
    industries_pool:
      - Manufacturing
      - Real Estate
      - Technology
      - Financials
      - Energy
      - Consumer Goods
      - Healthcare
      - Utilities
      - Materials
      - Industrials
      - Telecom
      - Retail
    sectors_pool:
      - Industrials
      - Financials
      - Technology
      - Energy
      - Consumer Discretionary
      - Healthcare
    companies_count: 5
  evolution:
    legacy_null_columns:
      - ebit
      - operating_cash_flow
      - retained_earnings
    legacy_partition_cutoff: 2020Q1
  duplication:
    offline_rate: 0.02
    streaming_rate: 0.015
  streaming:
    burst:
      enabled: true
      window_seconds: 10
      record_count: 200
    late_arrival:
      enabled: true
      max_lag_seconds: 3600
