# Machine-readable capture contract.  Commands are argv-style strings and are
# executed without a shell by scripts/capture_phase2_evidence.py.
#
# Trimmed 2026-08-14 to the LLM-only submission scope (ML track cancelled,
# see plans/260813-1846-production-hardening-overlay/plan.md Overview). The
# removed sections (phase3 supply-chain, phase4 capacity, phase5 kyverno,
# phase6 secrets-mesh, phase7 lakehouse, phase8 cdc, phase9 phase1-plane,
# phase10 ml, phase11 rollouts, phase12 freeze) targeted cluster operators
# (Kyverno, ESO, Linkerd, Lakekeeper, MLflow, Argo Rollouts) and archived
# apps (feature-api/drift-api) that are no longer part of this submission —
# running their kubectl/script commands against whatever cluster happens to
# be connected would record evidence for infrastructure this repo no longer
# claims to have.
sections:
  phase1:
    claim: "Phase 1 protected-path and rubric contracts remain green."
    command: "uv run --offline python scripts/audit_phase2_evidence.py --require-executed --track LLM --strict"
    screenshot: false
  phase2-tests:
    claim: "The Phase 2 rubric-matrix contract tests pass in the local checkout."
    command: "uv run --offline python -m pytest tests/phase2/test_rubric_matrix.py -q"
    screenshot: false
  phase2-matrix:
    claim: "The canonical LLM rubric matrix totals 100 points."
    command: "uv run --offline python scripts/audit_phase2_evidence.py --matrix-only --strict"
    screenshot: false
  phase2-quality-gates:
    claim: "Source and GitOps Phase 2 quality gates pass with rendered manifests and tests."
    command: "uv run --offline python scripts/run_phase2_quality_gates.py --gitops-root ../financial-distress-gitops"
    screenshot: false
