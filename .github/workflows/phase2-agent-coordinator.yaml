name: Phase 2 — coordinator agent

on:
  push:
    branches: [main, dev]
    paths:
      - "src/agents/**"
      - "src/llm/http_endpoint.py"
      - "tests/phase2/agents/**"
      - ".github/workflows/phase2-agent-coordinator.yaml"
  pull_request:
    branches: [main, dev]
    paths:
      - "src/agents/**"
      - "src/llm/http_endpoint.py"
      - "tests/phase2/agents/**"
      - ".github/workflows/phase2-agent-coordinator.yaml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/phase2-ci.yaml
    with:
      deployables: >-
        [{"name":"coordinator","image_context":".","dockerfile":"apps/feature-mcp/Dockerfile",
        "test_selector":"tests/phase2/agents -k 'coordinator or test_runtime_portability'",
        "lint_paths":"src/agents src/llm/http_endpoint.py tests/phase2/agents"}]
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
