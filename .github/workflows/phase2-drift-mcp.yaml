name: Phase 2 — drift MCP

on:
  push:
    branches: [main, dev]
    paths:
      - "apps/drift-mcp/**"
      - "src/drift/**"
      - "src/llm/http_endpoint.py"
      - "tests/phase2/apps/test_drift_api_and_mcp.py"
      - "tests/phase2/apps/test_portable_mcp_endpoints.py"
      - ".github/workflows/phase2-drift-mcp.yaml"
  pull_request:
    branches: [main, dev]
    paths:
      - "apps/drift-mcp/**"
      - "src/drift/**"
      - "src/llm/http_endpoint.py"
      - "tests/phase2/apps/test_drift_api_and_mcp.py"
      - "tests/phase2/apps/test_portable_mcp_endpoints.py"
      - ".github/workflows/phase2-drift-mcp.yaml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/phase2-ci.yaml
    with:
      deployables: >-
        [{"name":"drift-mcp","image_context":".","dockerfile":"apps/drift-mcp/Dockerfile",
        "test_selector":"tests/phase2/apps -k 'drift_mcp or test_portable_mcp_endpoints'",
        "lint_paths":"src/drift src/llm/http_endpoint.py apps/drift-mcp/app tests/phase2/apps"}]
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
