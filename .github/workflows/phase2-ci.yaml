name: Phase 2 pipeline CI (reusable)

# Reusable job template: lint -> test -> build -> push immutable digest ->
# open a GitOps digest-bump PR. Called by phase2-rag-pipeline.yaml,
# phase2-stream-feature-offline.yaml, phase2-stream-feature-online.yaml —
# each with its own `paths:` trigger, so each produces its own separately
# named run (Capture màn hình từng CI/CD pipeline đã run thành công needs
# distinct runs per pipeline, not one shared one).
#
# ci.yml (Phase 1 gate) is untouched and unnarrowed — Phase 1 keeps running
# on every push regardless of what touches this file.

on:
  workflow_call:
    inputs:
      pipeline_name:
        description: "Short pipeline identifier, e.g. rag-pipeline"
        required: true
        type: string
      image_context:
        description: "Docker build context path"
        required: true
        type: string
      dockerfile:
        description: "Path to the pipeline's Dockerfile"
        required: true
        type: string
      test_selector:
        description: "pytest path/-k expression scoping the test job to this pipeline"
        required: true
        type: string
      lint_paths:
        description: "Paths scoping ruff/black to this pipeline's own source (space-separated)"
        required: true
        type: string
    secrets:
      GHCR_TOKEN:
        required: true
      GITOPS_PAT:
        required: true

concurrency:
  group: phase2-ci-${{ inputs.pipeline_name }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint dependencies
        run: python -m pip install "ruff==0.8.*" "black==24.*"
      - name: ruff
        env:
          LINT_PATHS: ${{ inputs.lint_paths }}
        run: ruff check $LINT_PATHS
      - name: black --check
        env:
          LINT_PATHS: ${{ inputs.lint_paths }}
        run: black --check $LINT_PATHS

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: pytest (fast loop, no Docker services)
        env:
          TEST_SELECTOR: ${{ inputs.test_selector }}
        # Callers pass a selector like "tests/phase2/pipelines -k 'rag or
        # governance'" — the embedded quotes are only meaningful if the
        # shell re-parses the string. Unquoted $TEST_SELECTOR here does
        # plain word-splitting instead, so pytest would receive the quote
        # characters as literal tokens in its -k expression. eval re-parses
        # the string as shell input, honoring the embedded quotes.
        run: eval "python -m pytest $TEST_SELECTOR -m 'not slow'"

  build:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Compute lowercase image repository
        # GHCR/Docker tags must be all-lowercase; github.repository preserves
        # the repo's mixed-case name, so it cannot be used directly in a tag.
        id: image_repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.image_context }}
          file: ${{ inputs.dockerfile }}
          # Never push from a pull_request run — every caller also triggers
          # on pull_request:, and an untrusted/internal PR must not publish
          # a GHCR image before it merges.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ steps.image_repo.outputs.name }}/${{ inputs.pipeline_name }}:${{ github.sha }}

  gitops-pr:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'dev')
    steps:
      - name: Checkout GitOps control repo
        uses: actions/checkout@v4
        with:
          repository: emanhthangngot/financial-distress-gitops
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops
      - name: Rewrite pinned digest and open PR
        env:
          GH_TOKEN: ${{ secrets.GITOPS_PAT }}
          PIPELINE_NAME: ${{ inputs.pipeline_name }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          cd gitops
          branch="digest-bump/${PIPELINE_NAME}-${GITHUB_SHA::12}"
          git checkout -b "$branch"
          # Exact digest-file path/format is a GitOps-repo concern (values
          # file per pipeline); left as a placeholder command until that
          # repo's layout is read from — see phase-08's evidence capture.
          mkdir -p "pipelines/${PIPELINE_NAME}"
          echo "$DIGEST" > "pipelines/${PIPELINE_NAME}/digest.txt"
          git config user.name "phase2-ci"
          git config user.email "phase2-ci@users.noreply.github.com"
          git add "pipelines/${PIPELINE_NAME}/digest.txt"
          git commit -m "chore(${PIPELINE_NAME}): bump image digest to ${DIGEST}"
          git push origin "$branch"
          gh pr create --title "chore(${PIPELINE_NAME}): bump image digest" \
            --body "Automated digest bump from source commit ${GITHUB_SHA}." \
            --base main --head "$branch"
