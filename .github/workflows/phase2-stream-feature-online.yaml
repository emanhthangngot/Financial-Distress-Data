name: Phase 2 — stream feature online

on:
  push:
    branches: [main, dev]
    paths:
      - "src/ml/feast/online_job.py"
      - "src/ml/feast/feature_definitions.py"
      - "dags/stream_feature_online.py"
      - "infra/stream-feature-online/Dockerfile"
      - ".github/workflows/phase2-stream-feature-online.yaml"
  pull_request:
    branches: [main, dev]
    paths:
      - "src/ml/feast/online_job.py"
      - "src/ml/feast/feature_definitions.py"
      - "dags/stream_feature_online.py"
      - "infra/stream-feature-online/Dockerfile"
      - ".github/workflows/phase2-stream-feature-online.yaml"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/phase2-ci.yaml
    with:
      deployables: >-
        [{"name":"stream-feature-online","image_context":".","dockerfile":"infra/stream-feature-online/Dockerfile",
        "test_selector":"tests/platform/pipelines -k 'feast or ttl or stream'",
        "lint_paths":"src/ml/feast/online_job.py src/ml/feast/feature_definitions.py tests/platform/pipelines/test_stream_feature_jobs.py"}]
