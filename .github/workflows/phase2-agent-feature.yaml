name: Phase 2 — feature agent

on:
  push:
    branches: [main, dev]
    paths:
      - "src/agents/**"
      - "src/llm/http_endpoint.py"
      - "apps/feature-mcp/**"
      - "pyproject.toml"
      - "tests/platform/agents/**"
      - "tests/platform/apps/test_portable_mcp_endpoints.py"
      - ".github/workflows/phase2-agent-feature.yaml"
  pull_request:
    branches: [main, dev]
    paths:
      - "src/agents/**"
      - "src/llm/http_endpoint.py"
      - "apps/feature-mcp/**"
      - "pyproject.toml"
      - "tests/platform/agents/**"
      - "tests/platform/apps/test_portable_mcp_endpoints.py"
      - ".github/workflows/phase2-agent-feature.yaml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/phase2-ci.yaml
    with:
      deployables: >-
        [{"name":"feature-agent","image_context":".","dockerfile":"apps/feature-mcp/Dockerfile",
        "test_selector":"tests/platform/agents tests/platform/apps
        -k 'feature or agent or test_runtime_portability or test_portable_mcp_endpoints'",
        "lint_paths":"src/agents src/llm/http_endpoint.py apps/feature-mcp/app
        tests/platform/agents tests/platform/apps/test_portable_mcp_endpoints.py"}]
