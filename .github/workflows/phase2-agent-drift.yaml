name: Phase 2 — drift agent

on:
  push:
    branches: [main, dev]
    paths:
      - "src/agents/**"
      - "src/drift/**"
      - "src/llm/http_endpoint.py"
      - "apps/drift-mcp/**"
      - "tests/phase2/agents/**"
      - "tests/phase2/apps/test_drift_api_and_mcp.py"
      - "tests/phase2/apps/test_portable_mcp_endpoints.py"
      - ".github/workflows/phase2-agent-drift.yaml"
  pull_request:
    branches: [main, dev]
    paths:
      - "src/agents/**"
      - "src/drift/**"
      - "src/llm/http_endpoint.py"
      - "apps/drift-mcp/**"
      - "tests/phase2/agents/**"
      - "tests/phase2/apps/test_drift_api_and_mcp.py"
      - "tests/phase2/apps/test_portable_mcp_endpoints.py"
      - ".github/workflows/phase2-agent-drift.yaml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/phase2-ci.yaml
    with:
      deployables: >-
        [{"name":"drift-agent","image_context":".","dockerfile":"apps/drift-mcp/Dockerfile",
        "test_selector":"tests/phase2/agents tests/phase2/apps
        -k 'drift or agent or test_runtime_portability or test_portable_mcp_endpoints'",
        "lint_paths":"src/agents src/drift src/llm/http_endpoint.py apps/drift-mcp/app
        tests/phase2/agents tests/phase2/apps/test_portable_mcp_endpoints.py"}]
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
