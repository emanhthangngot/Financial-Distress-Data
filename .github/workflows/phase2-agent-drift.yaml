name: Phase 2 — drift agent

on:
  push:
    branches: [main, dev]
    paths:
      - "src/agents/**"
      - "src/drift/**"
      - "apps/drift-mcp/**"
      - "tests/phase2/agents/**"
      - "tests/phase2/apps/test_drift_api_and_mcp.py"
  pull_request:
    branches: [main, dev]
    paths:
      - "src/agents/**"
      - "src/drift/**"
      - "apps/drift-mcp/**"
      - "tests/phase2/agents/**"
      - "tests/phase2/apps/test_drift_api_and_mcp.py"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/phase2-ci.yaml
    with:
      deployables: >-
        [{"name":"drift-agent","image_context":".","dockerfile":"apps/drift-mcp/Dockerfile",
        "test_selector":"tests/phase2/agents tests/phase2/apps -k 'drift or agent'",
        "lint_paths":"src/agents src/drift apps/drift-mcp/app tests/phase2/agents",
        "gitops_path":"platform/agents/agent-deployments.yaml","gitops_target_type":"manifest","gitops_target_kind":"Deployment","gitops_target_selector":"drift-agent"}]
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
