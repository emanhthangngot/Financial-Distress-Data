name: Production — Gold and Feast materialization

on:
  push:
    branches: [main, dev]
    paths:
      - "configs/cluster-collector-config.yaml"
      - "feature_repo/structured/**"
      - "infra/lakehouse-cluster/Dockerfile.pipeline"
      - "scripts/run_cluster_pipeline.py"
      - "src/collectors/fixture_config.py"
      - "src/collectors/source_adapters/vnstock_fixture_adapter.py"
      - "src/jobs/lakehouse_evidence_job.py"
      - "src/ml/feast/**"
      - "tests/test_cluster_pipeline.py"
  pull_request:
    branches: [main, dev]
    paths:
      - "configs/cluster-collector-config.yaml"
      - "feature_repo/structured/**"
      - "infra/lakehouse-cluster/Dockerfile.pipeline"
      - "scripts/run_cluster_pipeline.py"
      - "src/collectors/fixture_config.py"
      - "src/collectors/source_adapters/vnstock_fixture_adapter.py"
      - "src/jobs/lakehouse_evidence_job.py"
      - "src/ml/feast/**"
      - "tests/test_cluster_pipeline.py"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/production-ci.yaml
    with:
      deployables: >-
        [{"name":"data-pipeline","image_context":".","dockerfile":"infra/lakehouse-cluster/Dockerfile.pipeline",
        "test_selector":"tests/test_cluster_pipeline.py tests/platform/pipelines -k 'cluster_pipeline or feast'",
        "lint_paths":"src/jobs/lakehouse_evidence_job.py src/collectors/fixture_config.py src/collectors/source_adapters/vnstock_fixture_adapter.py scripts/run_cluster_pipeline.py tests/test_cluster_pipeline.py",
        "gitops_path":"platform/data/pipeline-deployments.yaml","gitops_target_type":"manifest","gitops_target_kind":"CronJob","gitops_target_selector":"gold-producer"}]
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
