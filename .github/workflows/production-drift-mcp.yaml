name: Production — drift MCP

on:
  push:
    branches: [main, dev]
    paths:
      - "apps/drift-mcp/**"
      - "src/drift/**"
      - "tests/platform/apps/test_drift_api_and_mcp.py"
  pull_request:
    branches: [main, dev]
    paths:
      - "apps/drift-mcp/**"
      - "src/drift/**"
      - "tests/platform/apps/test_drift_api_and_mcp.py"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/production-ci.yaml
    with:
      deployables: >-
        [{"name":"drift-mcp","image_context":".","dockerfile":"apps/drift-mcp/Dockerfile",
        "test_selector":"tests/platform/apps -k 'drift_mcp'",
        "lint_paths":"src/drift apps/drift-mcp/app tests/platform/apps",
        "gitops_path":"apps/dev/drift-mcp/values.yaml","gitops_target_type":"values",
        "gitops_target_kind":"","gitops_target_selector":""}]
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
