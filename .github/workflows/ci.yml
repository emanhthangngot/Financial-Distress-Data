name: Stage 1 CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + all branches so scripts/audit_phase2_evidence.py can
          # resolve `origin/dev` and run its Phase 1 no-mutation git gate.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Package installability
        run: |
          pip install -e .
          cd /tmp && python -c "import src.ml.contracts; print('ok')"
      - name: Install Postgres server binaries
        # The Phase 2 RLS suite spins up its own ephemeral cluster with
        # initdb/pg_ctl. Without these on PATH the suite skips itself, which
        # would leave the authorization rules unverified everywhere.
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          ls -d /usr/lib/postgresql/*/bin | tail -1 >> "$GITHUB_PATH"
      - name: Stage 1 quality gates
        env:
          # Turn a missing Postgres into a failure instead of a silent skip.
          PHASE2_REQUIRE_PG: "1"
        run: python scripts/run_stage1_quality_gates.py

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Install Playwright browser
        run: pnpm --filter @distresslens/web exec playwright install --with-deps chromium
      - name: Accessibility gate
        run: |
          pnpm --filter @distresslens/web e2e:a11y
          pnpm --filter @distresslens/web e2e:a11y-roles
      - name: Upload coverage report
        # pnpm test already fails the job below threshold; this just makes the
        # per-file breakdown reviewable without re-running it locally.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            apps/web/coverage
            packages/contracts/coverage
          retention-days: 14
