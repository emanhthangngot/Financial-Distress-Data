services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financial_distress}
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - ./sql/init_project_metadata.sql:/docker-entrypoint-initdb.d/01_init_project_metadata.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow} -d ${POSTGRES_DB:-financial_distress}"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do sleep 2; done;
      mc mb --ignore-existing local/${FINANCIAL_DISTRESS_BUCKET:-financial-distress-lake};
      "

  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    volumes:
      - ./init:/opt/financial-distress-init:ro
      - kafka-data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 18

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./init:/opt/financial-distress-init:ro
    command: bash /opt/financial-distress-init/kafka_init_topics.sh

  flink-jobmanager:
    profiles: [flink]
    build:
      context: .
      dockerfile: infra/flink/Dockerfile
    image: financial-distress-flink:1.20.3
    working_dir: /tmp
    command: jobmanager
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
        parallelism.default: 1
        state.checkpoints.dir: file:///opt/flink/checkpoints
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    volumes:
      - ./:/opt/flink/project:ro
      - flink-output:/opt/flink/output
      - flink-checkpoints:/opt/flink/checkpoints

  flink-taskmanager:
    profiles: [flink]
    image: financial-distress-flink:1.20.3
    working_dir: /tmp
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 1
        state.checkpoints.dir: file:///opt/flink/checkpoints
    volumes:
      - ./:/opt/flink/project:ro
      - flink-output:/opt/flink/output
      - flink-checkpoints:/opt/flink/checkpoints

  airflow-webserver:
    build:
      context: .
      dockerfile: infra/airflow/Dockerfile
    image: financial-distress-airflow:stage1
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-financial_distress}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow
      PROJECT_METADATA_DSN: postgresql://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-financial_distress}
      AIRFLOW_CONN_PROJECT_METADATA: postgresql://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-financial_distress}
      AIRFLOW_VAR_FINANCIAL_DISTRESS_BUCKET: ${FINANCIAL_DISTRESS_BUCKET:-financial-distress-lake}
      AIRFLOW_VAR_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FINANCIAL_DISTRESS_BUCKET: ${FINANCIAL_DISTRESS_BUCKET:-financial-distress-lake}
      MINIO_ENDPOINT: http://minio:9000
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      SPARK_LOCAL_IP: 127.0.0.1
      STAGE1_EVIDENCE_DIR: /tmp/stage1-evidence
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./configs:/opt/airflow/configs
      - ./sql:/opt/airflow/sql
      - ./docs:/opt/airflow/docs
    ports:
      - "8080:8080"

  airflow-init:
    build:
      context: .
      dockerfile: infra/airflow/Dockerfile
    image: financial-distress-airflow:stage1
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -c "
      until airflow db migrate; do sleep 2; done;
      airflow users create --username airflow --password airflow --firstname Stage --lastname One --role Admin --email airflow@example.local || true
      "
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-financial_distress}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow
      PROJECT_METADATA_DSN: postgresql://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-financial_distress}
      AIRFLOW_CONN_PROJECT_METADATA: postgresql://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-financial_distress}
      AIRFLOW_VAR_FINANCIAL_DISTRESS_BUCKET: ${FINANCIAL_DISTRESS_BUCKET:-financial-distress-lake}
      AIRFLOW_VAR_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FINANCIAL_DISTRESS_BUCKET: ${FINANCIAL_DISTRESS_BUCKET:-financial-distress-lake}
      MINIO_ENDPOINT: http://minio:9000
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      SPARK_LOCAL_IP: 127.0.0.1
      STAGE1_EVIDENCE_DIR: /tmp/stage1-evidence
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./configs:/opt/airflow/configs
      - ./sql:/opt/airflow/sql
      - ./docs:/opt/airflow/docs

  airflow-scheduler:
    build:
      context: .
      dockerfile: infra/airflow/Dockerfile
    image: financial-distress-airflow:stage1
    command: scheduler
    depends_on:
      - airflow-webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-financial_distress}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow
      PROJECT_METADATA_DSN: postgresql://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-financial_distress}
      AIRFLOW_CONN_PROJECT_METADATA: postgresql://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-financial_distress}
      AIRFLOW_VAR_FINANCIAL_DISTRESS_BUCKET: ${FINANCIAL_DISTRESS_BUCKET:-financial-distress-lake}
      AIRFLOW_VAR_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FINANCIAL_DISTRESS_BUCKET: ${FINANCIAL_DISTRESS_BUCKET:-financial-distress-lake}
      MINIO_ENDPOINT: http://minio:9000
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      SPARK_LOCAL_IP: 127.0.0.1
      STAGE1_EVIDENCE_DIR: /tmp/stage1-evidence
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./configs:/opt/airflow/configs
      - ./sql:/opt/airflow/sql
      - ./docs:/opt/airflow/docs

volumes:
  postgres-data:
  minio-data:
  kafka-data:
  flink-output:
  flink-checkpoints:
