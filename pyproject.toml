[project]
name = "financial-distress-data"
version = "0.1.0"
description = "Local-first Financial Distress data engineering mini-coursework"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "black>=24.0",
    "playwright>=1.40",
]
runtime = [
    "duckdb>=1.1",
    "kafka-python>=2.0",
    "minio>=7.2",
    "pyarrow>=17.0",
    "psycopg[binary]>=3.2",
    "pyspark>=3.5",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["docs/evidence/final"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
