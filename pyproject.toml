[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-distress-data"
version = "0.1.0"
description = "Local-first Financial Distress data engineering mini-coursework"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "black>=24.0",
    "playwright>=1.40",
]
runtime = [
    "duckdb>=1.1",
    "kafka-python>=2.0",
    "minio>=7.2",
    "pyarrow>=17.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pyspark>=3.5",
    "requests>=2.31",
    "tenacity>=8.0",
]
platform = [
    "black>=24.0,<26",
    "fastapi>=0.115,<1",
    "feast>=0.40,<1",
    "httpx>=0.27,<1",
    "hypothesis>=6.112,<7",
    "kafka-python>=2.0,<3",
    "locust>=2.31,<3",
    "mcp>=1.0,<2",
    "minio>=7.2,<8",
    "mutmut>=3.0,<4",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pgvector>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "pyarrow>=17,<22",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5,<8",
    "pyyaml>=6,<7",
    "requests>=2.31,<3",
    "redis>=5.0,<7",
    "ruff>=0.8,<1",
    "tenacity>=8,<10",
    "uvicorn[standard]>=0.30,<1",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["docs/evidence/final"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "slow: takes more than ~2s; excluded by the fast loop",
    "services: requires the docker compose stack to be running",
    "postgres: requires local initdb/pg_ctl binaries",
]

[tool.mutmut]
# Phase 05's mutation gate is intentionally limited to small pure modules;
# service/network boundaries are covered with fixtures and mocks instead.
source_paths = ["src/llm/rag/chunking.py"]
also_copy = [
    "src/drift",
    "src/generator",
    "src/llm/contracts.py",
    "configs",
]
pytest_add_cli_args_test_selection = [
    "tests/platform/verification/test_mutmut_pure.py",
]
mutate_only_covered_lines = false
